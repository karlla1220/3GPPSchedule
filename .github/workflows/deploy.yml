name: Build and Deploy Schedule

on:
  repository_dispatch:
    types: [cronjob_trigger] # cron-job.org에서 보낼 이벤트 이름

  workflow_dispatch:
    inputs:
      action:
        description: '실행할 동작 선택'
        type: choice
        default: check-build-deploy
        options:
          - check-build-deploy  # 변경 감지 후 변경시에만 빌드/배포
          - build-deploy        # FTP 체크 생략, 캐시 유지한 채 빌드/배포 (generator.py만 변경시 유용)
          - force-deploy        # 캐시 초기화 후 빌드/배포
          - deploy-only         # 빌드 없이 현재 docs/ 그대로 배포

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: schedule-deploy
  cancel-in-progress: true

jobs:
  # ── Job 1: Lightweight FTP check (~20 seconds) ──────────────
  check:
    if: >-
      github.event_name == 'repository_dispatch' ||
      github.event.inputs.action == 'check-build-deploy'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      extra_files_artifact: ${{ steps.detect.outputs.extra_files_artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      # State is read from docs/.schedule_state.json (committed in repo)
      - name: Check for FTP updates
        id: detect
        run: uv run python check_update.py

      # A cache miss is downloaded once by check and passed to build. The
      # committed repository cache remains the long-term source of truth.
      - name: Upload extra-file transfer
        if: steps.detect.outputs.extra_files_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extra-files-${{ github.run_id }}
          path: downloads/.extra_files_transfer/
          include-hidden-files: true
          if-no-files-found: error

  # ── Job 2: Full build & deploy ──────────────────────────────
  # Runs when:
  #   - check detected changes (check-build-deploy)
  #   - build-deploy selected (skip check, reuse cache)
  #   - force-deploy selected (reset cache, full rebuild)
  build-and-deploy:
    needs: check
    if: |
      always() &&
      (needs.check.outputs.changed == 'true' ||
       github.event.inputs.action == 'build-deploy' ||
       github.event.inputs.action == 'force-deploy')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download extra-file transfer
        if: needs.check.outputs.extra_files_artifact == 'true'
        uses: actions/download-artifact@v4
        with:
          name: extra-files-${{ github.run_id }}
          path: downloads/.extra_files_transfer/

      - name: Apply extra-file transfer
        if: needs.check.outputs.extra_files_artifact == 'true'
        shell: bash
        run: |
          mkdir -p downloads/extra_files
          cp downloads/.extra_files_transfer/.extra_files_state.json docs/.extra_files_state.json
          find downloads/.extra_files_transfer -maxdepth 1 -type f \
            ! -name '.extra_files_state.json' \
            -exec cp -f {} downloads/extra_files/ \;

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      # ── LLM Cache: restore → run → save ──
      # Cache key uses run_id so every run saves a new snapshot.
      # restore-keys prefix fetches the most recent previous snapshot.
      # Cache is NOT OS/Python dependent — it depends on prompt version,
      # day, time block, main rooms, source content, and LLM model,
      # all of which are hashed internally by session_parser.py.
      - name: Restore LLM cache
        uses: actions/cache@v4
        with:
          path: .cache/
          key: llm-cache-${{ github.run_id }}
          restore-keys: |
            llm-cache-

      # force-deploy: wipe every persisted build input/result so the parser
      # cannot reuse data from an earlier build.
      - name: Reset caches (force-deploy)
        if: github.event.inputs.action == 'force-deploy'
        run: |
          rm -rf .cache/*
          rm -rf downloads/extra_files
          rm -f docs/.extra_files_state.json
          rm -f docs/.schedule_state.json
          rm -f docs/agenda_item_description.json

      - name: Run schedule parser
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCHEDULE_CONTACT_NAME: Duckhyun Bae
          SCHEDULE_CONTACT_EMAIL: duckhyun.bae@lge.com
        run: |
          if [ "${{ github.event.inputs.action }}" = "force-deploy" ]; then
            uv run python main.py --rebuild-slots
          else
            uv run python main.py
          fi

      - name: Check for output
        id: output
        run: |
          if [ -f docs/index.html ]; then
            echo "has_output=true" >> $GITHUB_OUTPUT
          else
            echo "has_output=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.output.outputs.has_output == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if [ -n "$(find downloads/extra_files -type f -print -quit 2>/dev/null)" ]; then
            git add downloads/extra_files/
          fi
          git diff --cached --quiet || git commit -m "Update schedule $(date +%Y-%m-%d_%H:%M) [skip ci]"
          git push

      - name: Setup Pages
        if: steps.output.outputs.has_output == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.output.outputs.has_output == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        if: steps.output.outputs.has_output == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Job 3: Deploy-only (no rebuild, just push existing docs/) ──
  deploy-only:
    if: github.event.inputs.action == 'deploy-only'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
