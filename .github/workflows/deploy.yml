name: Build and Deploy Schedule

on:
  repository_dispatch:
    types: [cronjob_trigger]
  workflow_dispatch:
    inputs:
      action:
        description: '실행할 동작 선택'
        type: choice
        default: check-build-deploy
        options:
          - check-build-deploy
          - build-deploy
          - force-deploy
          - deploy-only

permissions:
  contents: write
  pages: write
  id-token: write

# Share this lock with pages.yml. Do not cancel a parser or a deployment
# when the next periodic check arrives.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event_name == 'repository_dispatch' ||
      github.event.inputs.action == 'check-build-deploy'
    runs-on: ubuntu-latest
    environment: github-pages
    outputs:
      build_required: ${{ steps.detect.outputs.build_required }}
      has_errors: ${{ steps.detect.outputs.has_errors }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Supplement 3GPP certificate chain
        run: |
          uv run python scripts/prepare_ca_bundle.py "$RUNNER_TEMP/3gpp-ca-bundle.pem"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/3gpp-ca-bundle.pem" >> "$GITHUB_ENV"
      - name: Check every enabled WG
        id: detect
        run: uv run python ci.py check
      - name: Transfer build plan and staged documents
        if: steps.detect.outputs.build_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wg-inputs-${{ github.run_id }}
          path: .ci/
          include-hidden-files: true
          if-no-files-found: error
      - name: Report failed checks
        if: steps.detect.outputs.has_errors == 'true'
        run: |
          cat .ci/plan.json
          exit 1

  build-and-deploy:
    needs: check
    if: >-
      always() && !cancelled() &&
      (needs.check.outputs.build_required == 'true' ||
       github.event.inputs.action == 'build-deploy' ||
       github.event.inputs.action == 'force-deploy')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Supplement 3GPP certificate chain
        run: |
          uv run python scripts/prepare_ca_bundle.py "$RUNNER_TEMP/3gpp-ca-bundle.pem"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/3gpp-ca-bundle.pem" >> "$GITHUB_ENV"
      - name: Verify lifecycle and RAN1 regression tests
        run: uv run pytest -q
      - name: Receive build plan and staged documents
        if: needs.check.outputs.build_required == 'true'
        uses: actions/download-artifact@v4
        with:
          name: wg-inputs-${{ github.run_id }}
          path: .ci/
      - name: Restore WG caches
        uses: actions/cache@v4
        with:
          path: .cache/
          key: wg-cache-v1-${{ github.run_id }}
          restore-keys: |
            wg-cache-v1-
      - name: Build selected WGs and assemble site
        id: build
        env:
          WG_ACTION: ${{ github.event.inputs.action || 'check-build-deploy' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python ci.py build --action "$WG_ACTION"
      - name: Setup Pages
        if: steps.build.outputs.site_changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload changed site
        if: steps.build.outputs.site_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Deploy changed site
        if: steps.build.outputs.site_changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      # Commit AFTER deployment: if Pages fails, the next check still sees
      # the old source state and retries. State-only updates need no deploy.
      - name: Commit successful WG results and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv run python ci.py stage
          if ! git diff --cached --quiet; then
            git commit -m "Update WG schedules [skip ci]"
            git push
          fi
      - name: Report failed WG builds
        if: steps.build.outputs.has_errors == 'true'
        run: |
          cat .ci/build-report.json
          exit 1

  deploy-only:
    if: github.event.inputs.action == 'deploy-only'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - uses: actions/deploy-pages@v4
        id: deployment
