<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{MEETING_NAME}} - Schedule</title>
    <style>{{STYLES}}</style>
</head>
<body>
<div class="container">
    {{HEADER}}
{{SCHEDULE_CONTENT}}    <div class="popup-backdrop" id="popup-backdrop"></div>
    <div class="popup-floating" id="popup-floating"><div id="popup-content"></div><button class="popup-close" id="popup-close-btn">&times;</button></div>
    <div class="filter-panel collapsed">
        <button class="filter-toggle">&#9664; Filter</button>
        <div class="filter-header"><span>Session Filter <span class="filter-active-count"></span></span><button class="filter-clear">Clear</button></div>
        <div class="filter-controls"><label for="filter-dim-opacity-range">Unchecked opacity</label><div class="filter-dim-opacity"><input type="range" id="filter-dim-opacity-range" class="filter-dim-opacity-range" min="0.02" max="0.95" step="0.01" value="0.30"><span class="filter-dim-opacity-value">30%</span></div></div>
        <div class="filter-list"></div>
    </div>
    <script type="application/json" id="filter-data">{{FILTER_DATA}}</script>
</div>
<script>{{SCRIPT}}</script>
</body>
</html>
