<div class="docx-document"><article><div class="table-scroll"><table><tr><td colspan="1" rowspan="1"><p style="margin-top:3pt;margin-bottom:3pt"><span style="">The attention of the delegates to this meeting was drawn to the fact that it is not permitted to check in other delegates on their behalf. In the event of technical difficulties preventing check-in, delegates should present themselves in person to the Secretary.</span></p></td></tr></table></div></article></div>
